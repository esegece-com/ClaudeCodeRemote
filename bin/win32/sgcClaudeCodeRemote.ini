; sgcClaudeCodeRemote Configuration
; Copy this file to sgcClaudeCodeRemote.ini to use it.
; Command-line arguments override INI settings.

[Server]
Port=8765
Command=claude
Password=
Cols=120
Rows=40
MaxConnections=10
AuthTimeout=15
; Set to 1 to disable authentication
NoAuth=0

[TLS]
; Set to 1 to enable TLS 1.3
Enabled=0
CertFile=
KeyFile=
Password=
Port=0

[Firewall]
; Add one Allow= line per IP or CIDR range.
; If no Allow= lines are present, all IPs are allowed.
; Localhost (127.0.0.1) is always allowed.
;Allow=192.168.1.0/24

